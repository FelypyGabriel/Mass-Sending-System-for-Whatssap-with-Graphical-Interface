{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
 
  <title>Login - ffmft bot automation</title>
 
  <link rel="stylesheet" href="{% static 'mensagens/login.css' %}" />
 
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
     
      <h1>Login</h1>
     
      <div class="input-box">
        <input type="text" name="username" placeholder="username" required />
        <i class='bx bxs-user'></i>
      </div>
     
      <div class="input-box">
        <input type="password" name="password" placeholder="password" required />
        <i class='bx bxs-lock-alt'></i>
      </div>
     
      <div class="remember">
        <label><input type="checkbox" name="remember" /> lembrar de mim</label>
        <a href="#">esqueceu a senha?</a>
      </div>
     
      <button type="submit" class="btn">login</button>

      <!-- 🔥 NOVO: link para registrar -->
      <div class="register-link">
        <p>não tem conta? <a href="{% url 'register' %}">registre-se</a></p>
      </div>
     
      {% if messages %}
        <ul class="messages">
          {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </form>
  </div>
</body>
</html>
